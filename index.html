<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Zenit Pub — Burger From 1996</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#CF3D17;--white:#FCFAF6;--black:#1a1a1a;--grey:#7a7a7a}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Barlow Condensed',sans-serif;
  background:var(--white);color:var(--black);
  display:flex;flex-direction:column;
  height:100svh;
  overflow:hidden;
}

/* ── HERO TOP ── */
.home-hero{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px 20px;
  position:relative;
  overflow:hidden;
}

/* starburst — solo la forma ruota, il testo resta dritto */
.starburst-wrap{
  position:absolute;top:12px;right:12px;
  width:80px;height:80px;
  opacity:0;
  animation:fadeUp 0.8s ease 1s forwards;
}
.starburst-spin{
  position:absolute;inset:0;width:100%;height:100%;
  animation:spinSlow 18s linear infinite;
  transform-origin:center;
}
.starburst-text{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;pointer-events:none;
}
.sb-est{ font-size:10px;font-weight:800;letter-spacing:1.5px;color:#FCFAF6;line-height:1; }
.sb-year{ font-size:15px;font-weight:800;letter-spacing:1px;color:#FCFAF6;line-height:1; }
@keyframes spinSlow{to{transform:rotate(360deg)}}

/* corner brackets */
.corner{position:absolute;width:32px;height:32px;opacity:0}
.corner.tl{top:0;left:0;border-top:3px solid var(--red);border-left:3px solid var(--red);animation:fadeUp .5s ease .4s forwards}
.corner.tr{top:0;right:0;border-top:3px solid var(--red);border-right:3px solid var(--red);animation:fadeUp .5s ease .5s forwards}
.corner.bl{bottom:0;left:0;border-bottom:3px solid var(--red);border-left:3px solid var(--red);animation:fadeUp .5s ease .6s forwards}
.corner.br{bottom:0;right:0;border-bottom:3px solid var(--red);border-right:3px solid var(--red);animation:fadeUp .5s ease .7s forwards}

.home-logo{
  width:min(200px,55vw);
  opacity:0;
  animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .1s forwards;
}
.home-divider{
  width:40px;height:2px;background:var(--red);
  margin:12px auto 10px;
  opacity:0;animation:fadeUp .7s ease .4s forwards;
}
.home-tagline{
  font-size:11px;font-weight:600;letter-spacing:7px;text-transform:uppercase;
  color:var(--red);opacity:0;
  animation:fadeUp .7s ease .5s forwards;
}

/* ── CARDS GRID ── */
.home-grid-wrap{
  flex:1 1 0;
  display:flex;align-items:center;justify-content:center;
  padding:16px 24px 8px;
  overflow:hidden;
}
.home-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  width:100%;
  max-width:380px;
}

.home-card{
  background:var(--white);
  border:2px solid var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;
  text-decoration:none;color:var(--black);
  padding:18px 12px;
  transition:background .15s, color .15s, border-color .15s;
  -webkit-tap-highlight-color:transparent;
  opacity:0;
  min-height:100px;
}
.home-card:nth-child(1){animation:fadeUp .5s ease .6s forwards}
.home-card:nth-child(2){animation:fadeUp .5s ease .7s forwards}
.home-card:nth-child(3){animation:fadeUp .5s ease .8s forwards}
.home-card:nth-child(4){animation:fadeUp .5s ease .9s forwards}

.home-card:active{background:var(--red);color:var(--white)}
.home-card:active .card-sub{color:rgba(255,255,255,.65)}

/* MENU: l'unica col piena */
.home-card.primary{background:var(--red);color:var(--white);border-color:var(--red)}
.home-card.primary .card-sub{color:rgba(255,255,255,.65)}
.home-card.primary:active{background:#b03210}

.card-icon{ font-size:26px;line-height:1; }
.card-label{
  font-size:16px;font-weight:800;
  text-transform:uppercase;letter-spacing:2px;
  line-height:1;text-align:center;
}
.card-sub{
  font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  color:var(--grey);text-align:center;line-height:1.3;
  transition:color .15s;
}

/* ── FOOTER MINIMAL ── */
.home-footer{
  flex:0 0 auto;
  background:var(--black);color:var(--white);
  display:flex;align-items:center;justify-content:center;
  gap:16px;
  padding:10px 20px;
  font-size:11px;font-weight:400;letter-spacing:1px;opacity:.5;
}
.home-footer a{color:inherit;text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* desktop: centra tutto */
@media(min-width:768px){
  html,body{overflow:auto;height:auto}
  body{min-height:100svh}
  .home-hero{padding:56px 40px 28px}
  .home-logo{width:220px}
  .home-grid{max-width:440px;gap:16px}
  .home-card{padding:28px 20px;min-height:130px}
  .card-icon{font-size:32px}
  .card-label{font-size:20px}
  .home-footer{max-width:500px;margin:0 auto;width:100%}
}
</style>
</head>
<body>

<div class="home-hero">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="starburst-wrap" aria-hidden="true">
    <svg class="starburst-spin" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <path d="M60,4 L67,40 L98,18 L80,50 L116,52 L84,68 L104,98 L72,80 L68,116 L52,84 L22,104 L38,74 L4,60 L38,48 L20,18 L52,38 Z" fill="#CF3D17"/>
    </svg>
    <div class="starburst-text">
      <span class="sb-est">EST.</span>
      <span class="sb-year">1996</span>
    </div>
  </div>

  <img class="home-logo" src="logo.png" alt="Bar Zenit Pub">
  <div class="home-divider"></div>
  <p class="home-tagline">Burger From 1996 · Ateleta AQ</p>
</div>

<div class="home-grid-wrap">
  <div class="home-grid">
    <a class="home-card primary" href="menu.html">
      <span class="card-icon">🍔</span>
      <span class="card-label">Menu</span>
      <span class="card-sub">Tutti i piatti</span>
    </a>
    <a class="home-card" href="chi-siamo.html">
      <span class="card-icon">📖</span>
      <span class="card-label">Chi Siamo</span>
      <span class="card-sub">La nostra storia</span>
    </a>
    <a class="home-card" href="prenota.html">
      <span class="card-icon">📲</span>
      <span class="card-label">Prenota</span>
      <span class="card-sub">Riserva il tavolo</span>
    </a>
    <a class="home-card" href="gioca.html">
      <span class="card-icon">🕹️</span>
      <span class="card-label">Attesa</span>
      <span class="card-sub">Gioca mentre aspetti</span>
    </a>
  </div>
</div>

<div class="home-footer">
  <a href="tel:+393515370997">351 537 0997</a>
  <span>·</span>
  <span>Via Stazione 6, Ateleta</span>
</div>

</body>
</html>
