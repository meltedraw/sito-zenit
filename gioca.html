<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Attesa — Bar Zenit Pub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#CF3D17;--white:#FCFAF6;--black:#1a1a1a;--nav-h:54px}
html,body{height:100%;overflow:hidden;touch-action:none}
body{
  font-family:'Barlow Condensed',sans-serif;
  background:var(--black);color:var(--white);
  display:flex;flex-direction:column;
  height:100svh;
}

/* ── NAV ── */
nav{
  flex:0 0 var(--nav-h);
  background:var(--black);
  border-bottom:2px solid rgba(255,255,255,.1);
  display:grid;grid-template-columns:var(--nav-h) 1fr var(--nav-h);
  align-items:center;
  z-index:10;
}
.nav-back{
  display:flex;align-items:center;justify-content:center;
  width:var(--nav-h);height:var(--nav-h);
  text-decoration:none;color:var(--white);font-size:22px;
  -webkit-tap-highlight-color:transparent;
}
.nav-title{text-align:center;font-size:12px;font-weight:800;letter-spacing:4px;text-transform:uppercase;opacity:.6}
.nav-spacer{width:var(--nav-h)}

/* ── GAME WRAPPER ── */
.game-wrap{
  flex:1;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
canvas{
  display:block;
  touch-action:none;
  cursor:none;
}

/* ── OVERLAY SCREENS ── */
.overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(252,250,246,.96);
  color:var(--black);
  text-align:center;padding:24px;
  z-index:5;
}
.overlay.hidden{display:none}
.overlay h2{
  font-size:clamp(32px,10vw,56px);font-weight:800;
  text-transform:uppercase;letter-spacing:2px;
  color:var(--black);line-height:1;margin-bottom:12px;
}
.overlay h2 span{color:var(--red)}
.overlay p{
  font-size:15px;font-weight:400;color:var(--black);opacity:.55;
  margin-bottom:28px;line-height:1.5;
}
.overlay .score-display{
  font-size:clamp(48px,14vw,80px);font-weight:800;
  color:var(--red);line-height:1;margin-bottom:8px;
}
.overlay .score-label{
  font-size:11px;font-weight:800;letter-spacing:4px;text-transform:uppercase;
  color:var(--black);opacity:.4;margin-bottom:28px;
}
.btn-start{
  background:var(--red);color:var(--white);
  border:none;font-family:'Barlow Condensed',sans-serif;
  font-size:16px;font-weight:800;letter-spacing:4px;text-transform:uppercase;
  padding:16px 40px;cursor:pointer;
  transition:background .15s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.btn-start:active{background:#b03210;transform:scale(0.97)}

/* ── HUD ── */
.hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px;
  pointer-events:none;
  z-index:4;
}
.hud-item{
  font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:var(--black);opacity:.6;
}
.hud-score{color:var(--red);font-size:16px;opacity:1}

/* ── MOBILE TOUCH CONTROL ── */
.touch-zone{
  position:absolute;bottom:0;left:0;right:0;height:80px;
  z-index:3;
  display:none;
}
@media(pointer:coarse){.touch-zone{display:block}}
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="index.html" id="backBtn" aria-label="Torna alla home">&#8592;</a>
  <div class="nav-title">Breakout · Zenit</div>
  <div class="nav-spacer"></div>
</nav>

<div class="game-wrap" id="gameWrap">
  <canvas id="canvas"></canvas>

  <div class="hud" id="hud">
    <span class="hud-item" id="hudLives">❤️❤️❤️</span>
    <span class="hud-item hud-score" id="hudScore">0</span>
    <span class="hud-item" id="hudLevel">LV 1</span>
  </div>

  <!-- START SCREEN -->
  <div class="overlay" id="startScreen">
    <h2>Breakout<br><span>Zenit</span></h2>
    <p>Rompi tutti i blocchi.<br>Muovi la racchetta con il dito o il mouse.</p>
    <button class="btn-start" id="btnStart">Inizia</button>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="gameOverScreen">
    <h2>Game<br><span>Over</span></h2>
    <div class="score-display" id="finalScore">0</div>
    <div class="score-label">punti</div>
    <button class="btn-start" id="btnRestart">Rigioca</button>
  </div>

  <!-- WIN SCREEN -->
  <div class="overlay hidden" id="winScreen">
    <h2 id="winTitle">🍔<br><span>Bravo!</span></h2>
    <p id="winSub">Hai distrutto tutto.<br>Il tuo ordine è quasi pronto!</p>
    <div class="score-display" id="winScore">0</div>
    <div class="score-label">punti</div>
    <button class="btn-start" id="btnNext">Prossimo livello</button>
  </div>

  <div class="touch-zone" id="touchZone"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('gameWrap');

const C = { bg:'#FCFAF6', red:'#CF3D17', black:'#1a1a1a' };

const LEVELS = [
  { speed:5.2, paddleMult:1.15, twoHitRows:0, rows:5 }, // LV 1 — facile
  { speed:6.5, paddleMult:1.00, twoHitRows:1, rows:6 }, // LV 2
  { speed:7.8, paddleMult:0.88, twoHitRows:2, rows:7 }, // LV 3
  { speed:9.2, paddleMult:0.75, twoHitRows:3, rows:7 }, // LV 4
  { speed:11.0, paddleMult:0.62, twoHitRows:5, rows:7 }, // LV 5 MAX
];
const MAX_LEVEL = LEVELS.length;

const PU = {
  multi: { color:'#ff8800', label:'×3', desc:'Multi-Ball!' },
  wide:  { color:'#22aa44', label:'↔',  desc:'Paddle Largo!', dur:8000 },
  life:  { color:'#ff3366', label:'♥',  desc:'+1 Vita!' },
};
const PU_CHANCE = 0.12; // 12% per mattone distrutto

let W, H, dpr;
let state = 'start';
let score = 0, lives = 3, level = 1;
let paddle, balls, bricks, particles, powerups;
let effects = { wide:0 };
let flashMsg = null;
let animId = null, touchX = null;

function levelCfg(){ return LEVELS[Math.min(level-1, MAX_LEVEL-1)]; }

// ── RESIZE ──
function resize(){
  const rect = wrap.getBoundingClientRect();
  W = rect.width; H = rect.height;
  dpr = window.devicePixelRatio || 1;
  canvas.width  = W*dpr; canvas.height = H*dpr;
  canvas.style.width  = W+'px'; canvas.style.height = H+'px';
  ctx.scale(dpr, dpr);
  if(state === 'playing') initLevel(false);
}

// ── FACTORY ──
function makePaddle(){
  const base = Math.min(88, W*0.25) * levelCfg().paddleMult;
  return { w:base, h:10, x:W/2-base/2, y:H-36, baseW:base };
}

function makeBall(launched){
  const spd   = levelCfg().speed;
  const angle = (Math.random()*50-25) * Math.PI/180;
  return {
    x:W/2, y: paddle ? paddle.y-18 : H*0.65,
    r:6,
    vx: spd * Math.sin(angle) * (Math.random()>.5?1:-1),
    vy: -spd * Math.cos(angle),
    launched: !!launched,
  };
}

const BRICK_COLS = 13;
const BRICK_PAD  = 3;

function makeBricks(){
  const cfg = levelCfg();
  const rows = cfg.rows;
  const bw = (W - BRICK_PAD*(BRICK_COLS+1)) / BRICK_COLS;
  const bh = 10;
  const offsetY = 58;
  const colors = ['#7a1800','#9a2408','#b82c0c','#cf3d17','#d94f28','#e05530','#ea7050'];
  const arr = [];
  for(let r=0; r<rows; r++){
    for(let c=0; c<BRICK_COLS; c++){
      const maxHits = r < cfg.twoHitRows ? 2 : 1;
      arr.push({
        x: BRICK_PAD + c*(bw+BRICK_PAD),
        y: offsetY + r*(bh+BRICK_PAD),
        w:bw, h:bh, alive:true,
        color: colors[r % colors.length],
        hits:maxHits, maxHits,
        pts: (rows - r) * 10,
      });
    }
  }
  return arr;
}

// ── PARTICLES ──
function spawnParticles(x,y,color){
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2, spd=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:.05+Math.random()*.04,r:1.5+Math.random()*2.5,color});
  }
}

// ── POWER-UPS ──
function spawnPowerup(x,y){
  const types = Object.keys(PU);
  const type  = types[Math.floor(Math.random()*types.length)];
  powerups.push({ x, y, w:34, h:18, vy:2.2, type });
}

function applyEffect(type){
  const now = performance.now();
  if(type === 'multi'){
    const ref = balls.find(b=>b.launched) || balls[0];
    for(let i=0;i<2;i++){
      const spd = levelCfg().speed;
      const a   = (30 + Math.random()*120) * Math.PI/180;
      balls.push({
        x:ref.x, y:ref.y, r:6,
        vx: spd * Math.cos(a) * (i===0?1:-1),
        vy: -Math.abs(spd * Math.sin(a)),
        launched:true,
      });
    }
  } else if(type === 'wide'){
    effects.wide = now + PU.wide.dur;
    paddle.w = paddle.baseW * 1.65;
    paddle.x = Math.min(paddle.x, W - paddle.w);
  } else if(type === 'life'){
    lives = Math.min(lives+1, 5);
    updateHUD();
  }
}

// ── INIT ──
function initLevel(resetAll){
  if(resetAll){ score=0; lives=3; level=1; }
  paddle   = makePaddle();
  balls    = [makeBall(false)];
  bricks   = makeBricks();
  particles = [];
  powerups  = [];
  effects   = { wide:0 };
  flashMsg  = null;
  updateHUD();
}

function updateHUD(){
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudLevel').textContent = level>=MAX_LEVEL ? 'LV MAX' : 'LV '+level;
  document.getElementById('hudLives').textContent = '❤️'.repeat(Math.max(0,lives)) || '💀';
}

// ── DRAW ──
function drawBrick(b){
  const damaged = b.maxHits > 1 && b.hits < b.maxHits;
  ctx.fillStyle = damaged ? '#e8b090' : b.color;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  if(damaged){
    ctx.strokeStyle='rgba(100,30,10,.5)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(b.x+b.w*.3,b.y); ctx.lineTo(b.x+b.w*.45,b.y+b.h);
    ctx.moveTo(b.x+b.w*.65,b.y); ctx.lineTo(b.x+b.w*.55,b.y+b.h);
    ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fillRect(b.x,b.y,b.w,2.5);
  ctx.strokeStyle='rgba(0,0,0,.1)'; ctx.lineWidth=.5;
  ctx.strokeRect(b.x+.25,b.y+.25,b.w-.5,b.h-.5);
}

function drawPaddle(){
  // Wide effect → blue tint stripe
  ctx.fillStyle = C.black;
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,4); ctx.fill(); }
  else ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  const sw = paddle.w * .45;
  ctx.fillStyle = effects.wide && performance.now()<effects.wide ? '#22aa44' : C.red;
  ctx.fillRect(paddle.x+(paddle.w-sw)/2, paddle.y+3, sw, 4);
}

function drawBall(b){
  const g = ctx.createRadialGradient(b.x,b.y+1,0,b.x,b.y,b.r*4);
  g.addColorStop(0,'rgba(207,61,23,.2)'); g.addColorStop(1,'rgba(207,61,23,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle='#FCFAF6'; ctx.fill();
  ctx.strokeStyle=C.red; ctx.lineWidth=2.5; ctx.stroke();
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawPowerups(){
  powerups.forEach(pu=>{
    const info = PU[pu.type];
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(pu.x-pu.w/2,pu.y-pu.h/2,pu.w,pu.h,4); ctx.fillStyle=info.color; ctx.fill(); }
    else { ctx.fillStyle=info.color; ctx.fillRect(pu.x-pu.w/2,pu.y-pu.h/2,pu.w,pu.h); }
    ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(info.label, pu.x, pu.y);
  });
}

function drawFlash(){
  if(!flashMsg) return;
  const rem = flashMsg.until - performance.now();
  if(rem <= 0){ flashMsg=null; return; }
  ctx.globalAlpha = Math.min(1, rem/400);
  ctx.font = '800 22px "Barlow Condensed",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = flashMsg.color;
  ctx.fillText(flashMsg.text, W/2, H*0.34);
  ctx.globalAlpha = 1;
}

// ── MAIN LOOP ──
function loop(){
  // Schedule next frame FIRST — loop never stops regardless of state
  animId = requestAnimationFrame(loop);

  // Background + grid
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,0.04)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=36){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(let y=0;y<H;y+=36){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }

  if(state !== 'playing'){
    drawParticles();
    return;
  }

  const now = performance.now();

  // ── Effect timers ──
  if(effects.wide && now > effects.wide){
    effects.wide = 0;
    paddle.w = paddle.baseW;
  }

  // ── Particles ──
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=p.decay; });
  particles = particles.filter(p=>p.life>0);

  // ── Paddle ──
  if(touchX !== null) paddle.x = touchX - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W-paddle.w, paddle.x));

  // ── Power-ups: fall + collect ──
  powerups.forEach(pu=>{ pu.y += pu.vy; });
  powerups = powerups.filter(pu=>{
    if(pu.y+pu.h/2 >= paddle.y && pu.y-pu.h/2 <= paddle.y+paddle.h &&
       pu.x >= paddle.x && pu.x <= paddle.x+paddle.w){
      applyEffect(pu.type);
      flashMsg = { text: PU[pu.type].desc, color: PU[pu.type].color, until: now+1500 };
      return false;
    }
    return pu.y < H+20;
  });

  // ── Balls ──
  const toRemove = [];
  balls.forEach((ball, bi)=>{
    if(!ball.launched){
      ball.x = paddle.x + paddle.w/2;
      ball.y = paddle.y - ball.r - 2;
      return;
    }
    ball.x += ball.vx; ball.y += ball.vy;

    // Walls
    if(ball.x-ball.r<0)  { ball.x=ball.r;   ball.vx=Math.abs(ball.vx); }
    if(ball.x+ball.r>W)  { ball.x=W-ball.r; ball.vx=-Math.abs(ball.vx); }
    if(ball.y-ball.r<0)  { ball.y=ball.r;   ball.vy=Math.abs(ball.vy); }

    // Paddle hit
    if(ball.vy>0 && ball.y+ball.r>=paddle.y && ball.y-ball.r<=paddle.y+paddle.h &&
       ball.x>=paddle.x && ball.x<=paddle.x+paddle.w){
      ball.vy = -Math.abs(ball.vy);
      const hitPos = (ball.x-(paddle.x+paddle.w/2)) / (paddle.w/2);
      const spd = Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      ball.vx = hitPos * spd * 0.85;
      ball.vy = -Math.sqrt(Math.max(spd*spd - ball.vx*ball.vx, 0.5));
      spawnParticles(ball.x, paddle.y, C.red);
    }

    // Out bottom
    if(ball.y - ball.r > H){ toRemove.push(bi); return; }

    // Brick collision — one per frame, face detection
    let hit = false;
    for(let i=0; i<bricks.length && !hit; i++){
      const b = bricks[i];
      if(!b.alive) continue;
      const bL=ball.x-ball.r, bR=ball.x+ball.r, bT=ball.y-ball.r, bB=ball.y+ball.r;
      if(bR>b.x && bL<b.x+b.w && bB>b.y && bT<b.y+b.h){
        hit=true;
        b.hits--;
        if(b.hits<=0){
          b.alive=false; score+=b.pts; updateHUD();
          spawnParticles(b.x+b.w/2,b.y+b.h/2,b.color);
          if(Math.random()<PU_CHANCE) spawnPowerup(b.x+b.w/2,b.y+b.h/2);
        } else {
          spawnParticles(b.x+b.w/2,b.y+b.h/2,'rgba(220,140,90,0.9)');
        }
        const ol=bR-b.x, or_=b.x+b.w-bL, ot=bB-b.y, ob=b.y+b.h-bT;
        const mn=Math.min(ol,or_,ot,ob);
        if(mn===ol||mn===or_) ball.vx*=-1; else ball.vy*=-1;
        // Top-row speed burst
        if(b.y < 58+3*(10+BRICK_PAD)){
          const spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
          if(spd < levelCfg().speed*1.3){ ball.vx*=1.06; ball.vy*=1.06; }
        }
      }
    }
  });

  // Remove dead balls (reverse order)
  for(let i=toRemove.length-1;i>=0;i--) balls.splice(toRemove[i],1);

  // All balls lost → lose life
  if(balls.length===0){
    lives--; updateHUD();
    if(lives<=0){
      state='over';
      document.getElementById('finalScore').textContent=score;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    } else {
      // Restore paddle to base width before making new ball
      paddle.w = paddle.baseW; effects.wide=0;
      balls = [makeBall(false)];
    }
  }

  // Win
  if(state==='playing' && bricks.every(b=>!b.alive)){
    state='win';
    document.getElementById('winScore').textContent=score;
    if(level>=MAX_LEVEL){
      document.getElementById('winTitle').innerHTML='🏆<br><span>Leggendario!</span>';
      document.getElementById('winSub').textContent='Hai completato tutti i 5 livelli. Ordine in arrivo!';
      document.getElementById('btnNext').textContent="Rigioca dall'inizio";
    } else {
      document.getElementById('winTitle').innerHTML='🍔<br><span>Livello '+level+' Completo!</span>';
      document.getElementById('winSub').textContent='Preparati al livello '+(level+1)+' — più veloce, più duro.';
      document.getElementById('btnNext').textContent='Livello '+(level+1);
    }
    document.getElementById('winScreen').classList.remove('hidden');
  }

  // ── Draw ──
  drawParticles();
  bricks.filter(b=>b.alive).forEach(drawBrick);
  drawPowerups();
  drawPaddle();
  balls.forEach(drawBall);
  drawFlash();
}

// ── INPUT ──
canvas.addEventListener('mousemove', e=>{
  const rect=canvas.getBoundingClientRect(); touchX=e.clientX-rect.left;
});
canvas.addEventListener('click', ()=>{
  const b=balls && balls.find(b=>!b.launched); if(b) b.launched=true;
});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect(); touchX=e.touches[0].clientX-rect.left;
},{passive:false});
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect(); touchX=e.touches[0].clientX-rect.left;
  const b=balls && balls.find(b=>!b.launched); if(b) b.launched=true;
},{passive:false});
canvas.addEventListener('touchend',()=>{},{passive:true});

const tz=document.getElementById('touchZone');
tz.addEventListener('touchmove',e=>{ e.preventDefault(); touchX=e.touches[0].clientX; },{passive:false});
tz.addEventListener('touchstart',e=>{
  e.preventDefault(); touchX=e.touches[0].clientX;
  const b=balls && balls.find(b=>!b.launched); if(b) b.launched=true;
},{passive:false});

// Buttons
document.getElementById('btnStart').addEventListener('click',()=>{
  document.getElementById('startScreen').classList.add('hidden');
  initLevel(true); state='playing';
  if(!animId) loop();
});
document.getElementById('btnRestart').addEventListener('click',()=>{
  document.getElementById('gameOverScreen').classList.add('hidden');
  initLevel(true); state='playing';
});
document.getElementById('btnNext').addEventListener('click',()=>{
  document.getElementById('winScreen').classList.add('hidden');
  if(level>=MAX_LEVEL){ level=1; initLevel(true); } else { level++; initLevel(false); }
  state='playing';
});

document.getElementById('backBtn').addEventListener('click',e=>{
  if(state==='playing'){
    e.preventDefault(); state='paused';
    if(confirm('Vuoi uscire dal gioco?')) window.location.href='index.html';
    else state='playing';
  }
});

window.addEventListener('resize', resize);
resize();
loop();
</script>
</body>
</html>
